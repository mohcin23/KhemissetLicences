version: '3.8'

services:
  db:
    image: mysql:8
    container_name: khemisset_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: khemisset_db
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/khemisset_db.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: khemisset_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: khemisset_db
      DB_PORT: 3306
      JWT_SECRET: super_secret_jwt_key_32_chars_min
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: khemisset_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
