name: CI KhemissetLicences

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  services-ci:
    name: Microservices Install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - demandes-service
          - pdf-service
          - ocr-service
          - ai-service
          - notification-service
          - audit-service
          - workflow-service
          - licences-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install shared dependencies
        working-directory: ./shared
        run: npm install

      - name: Install service dependencies
        working-directory: ./services/${{ matrix.service }}
        run: npm install

  api-gateway-ci:
    name: API Gateway Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./api-gateway
        run: npm install

  frontend-ci:
    name: Frontend Install and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: CI=false npm run build
