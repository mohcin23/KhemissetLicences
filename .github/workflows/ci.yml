name: CI KhemissetLicences

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-config:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate JSON files
        run: |
          echo "Validating package.json files..."
          for f in $(find . -name "package.json" -not -path "*/node_modules/*"); do
            echo "Checking $f"
            python3 -c "import json; json.load(open('$f'))" || exit 1
          done
          echo "All JSON files are valid."

  services-ci:
    name: Service — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate-config
    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - demandes-service
          - pdf-service
          - ocr-service
          - ai-service
          - notification-service
          - audit-service
          - workflow-service
          - licences-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install shared dependencies
        working-directory: ./shared
        run: npm install

      - name: Install service dependencies
        working-directory: ./services/${{ matrix.service }}
        run: npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Verify service starts
        working-directory: ./services/${{ matrix.service }}
        run: timeout 5 node server.js || true

  api-gateway-ci:
    name: API Gateway
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./api-gateway
        run: npm install

      - name: Verify gateway starts
        working-directory: ./api-gateway
        run: timeout 5 node server.js || true

  frontend-ci:
    name: Frontend
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint frontend
        working-directory: ./frontend
        run: npx eslint src/ --max-warnings=50 || true

      - name: Build frontend
        working-directory: ./frontend
        run: CI=false npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [services-ci, api-gateway-ci, frontend-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build all Docker images
        run: docker compose build --parallel
