name: CI/CD KhemissetLicences

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION_BACKEND: '18'
  NODE_VERSION_FRONTEND: '20'

jobs:
  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate package.json files
        run: |
          for f in $(find . -name "package.json" -not -path "*/node_modules/*"); do
            echo "Checking $f"
            python3 -c "import json; json.load(open('$f'))" || exit 1
          done
          echo "All JSON files valid."

  services-lint:
    name: Lint — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - demandes-service
          - notification-service
          - audit-service
          - workflow-service
          - licences-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_BACKEND }}

      - name: Install shared dependencies
        working-directory: ./shared
        run: npm install

      - name: Install service dependencies
        working-directory: ./services/${{ matrix.service }}
        run: npm install

      - name: Verify service starts (3s timeout)
        working-directory: ./services/${{ matrix.service }}
        run: timeout 3 node server.js
        env:
          JWT_SECRET: test_secret_key_for_ci_only
          DB_HOST: localhost
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: test
          REDIS_URL: redis://localhost:6379

  services-special:
    name: Lint — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        service:
          - pdf-service
          - ocr-service
          - ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_BACKEND }}

      - name: Install shared dependencies
        working-directory: ./shared
        run: npm install

      - name: Install service dependencies
        working-directory: ./services/${{ matrix.service }}
        run: npm install

  api-gateway-lint:
    name: Lint — api-gateway
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_BACKEND }}

      - name: Install dependencies
        working-directory: ./api-gateway
        run: npm install

      - name: Verify gateway starts
        working-directory: ./api-gateway
        run: timeout 3 node server.js
        env:
          PORT: 3001
          NODE_ENV: test

  frontend-lint:
    name: Lint & Build — frontend
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_FRONTEND }}

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint
        working-directory: ./frontend
        run: npx eslint src/ --max-warnings=50

      - name: Build
        working-directory: ./frontend
        run: CI=false npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [services-lint, services-special, api-gateway-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build all Docker images
        run: docker compose build --parallel

      - name: Verify all images exist
        run: |
          echo "Built images:"
          docker images --format "table {{.Repository}}\t{{.Size}}" | grep "^l-"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://31.220.90.152
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 31.220.90.152
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /root/KhemissetLicences
            git pull origin main
            docker compose build --parallel
            docker compose up -d --remove-orphans
            sleep 15
            curl -sf http://localhost:3001/api/health || exit 1
            echo "Deployment successful"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: 31.220.90.152
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== Container Status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}"
            echo ""
            echo "=== API Health ==="
            curl -s http://localhost:3001/api/health
